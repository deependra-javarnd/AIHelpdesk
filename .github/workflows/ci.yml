name: AI Helpdesk CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

     steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build --no-restore


#         | YAML             | Purpose                                   |
# | ---------------- | ----------------------------------------- |
# | `name`           | Workflow name shown in GitHub Actions     |
# | `on: push`       | Trigger workflow when code is pushed      |
# | `branches: main` | Only pushes to `main` trigger it          |
# | `jobs`           | Defines work GitHub should perform        |
# | `runs-on`        | Machine/OS used for the job               |
# | `checkout`       | Downloads your repository onto the runner |
# | `setup-dotnet`   | Installs/sets up .NET 8                   |
# | `restore`        | Downloads NuGet dependencies              |
# | `build`          | Compiles the solution                     |
# | `test`           | Executes your automated tests             |
